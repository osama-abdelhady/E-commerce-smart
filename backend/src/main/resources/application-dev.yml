spring:
  datasource:
    # Defaults to localhost for a bare-metal/IDE run against `docker compose up`
    # exposing 1521 on the host. docker-compose.yml overrides DB_URL to the
    # oracle-xe service hostname when the backend itself runs in a container
    # (localhost inside a container would mean the container, not the DB).
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${DB_USERNAME:ecommerce_app}
    password: ${DB_PASSWORD:ecommerce_dev_password}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

logging:
  level:
    root: INFO
    com.tailoredplatform.ecommerce: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  cookies:
    secure: false   # allow http://localhost in dev; real deployments must keep this true
