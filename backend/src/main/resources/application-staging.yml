spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 15
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

logging:
  level:
    root: INFO
    com.tailoredplatform.ecommerce: INFO

app:
  cors:
    allowed-origins: ${STAGING_FRONTEND_URL}
  cookies:
    secure: true
