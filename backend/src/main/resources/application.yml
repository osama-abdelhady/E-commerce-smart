spring:
  application:
    name: ecommerce-backend
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate   # schema truth lives in Flyway migrations, never Hibernate auto-DDL
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 30
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 30
    issuer: tailoredplatform-ecommerce
  cors:
    allowed-origins: http://localhost:4200
  cookies:
    refresh-token-name: refresh_token
    secure: true
    same-site: Strict
  stripe:
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    secret-key: ${STRIPE_SECRET_KEY:}
