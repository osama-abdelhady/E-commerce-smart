version: '3.8'

# Uses gvenzl/oracle-xe (Apache-2.0, community-maintained) rather than
# Oracle's own container-registry.oracle.com image: the official image
# requires an Oracle account login + license click-through even to `docker
# pull`, which breaks `docker compose up` for anyone cloning this repo.
# gvenzl/oracle-xe wraps the same Oracle XE 21.3 binaries, is what most
# Spring Boot + Oracle tutorials standardize on, and needs no auth to pull.
# Swap the image line below if your org requires the official one.
services:
  oracle-xe:
    image: gvenzl/oracle-xe:21.3.0-slim
    container_name: ecommerce-oracle-xe
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-oracle_sys_password}
      APP_USER: ${DB_USERNAME:-ecommerce_app}
      APP_USER_PASSWORD: ${DB_PASSWORD:-ecommerce_dev_password}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ecommerce-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    depends_on:
      oracle-xe:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # oracle-xe here is the Docker service hostname above, NOT localhost —
      # see the comment on application-dev.yml's datasource.url for why this
      # distinction matters once the backend itself is containerized.
      DB_URL: jdbc:oracle:thin:@//oracle-xe:1521/XEPDB1
      DB_USERNAME: ${DB_USERNAME:-ecommerce_app}
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce_dev_password}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — generate one with: openssl rand -base64 64}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:80}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks:
      - ecommerce-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge

volumes:
  oracle-data:
