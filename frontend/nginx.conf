server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular's client-side router owns everything that isn't a real static
    # file or an /api/ call — fall through to index.html so a hard refresh
    # on e.g. /products/some-slug doesn't 404 at the web server.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxied to the backend container on the same Docker network —
    # environment.prod.ts's apiBaseUrl is '/api/v1', relative to this origin,
    # so the browser never needs to know the backend's real hostname.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for the refresh-token cookie (Set-Cookie / Cookie headers)
        # to survive the proxy hop intact.
        proxy_pass_header Set-Cookie;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
