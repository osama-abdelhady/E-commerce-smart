<h1>Orders</h1>

<div class="filter-bar card">
  <input type="text" placeholder="Order number" [(ngModel)]="orderNumberFilter" (keyup.enter)="applyFilters()" />
  <input type="text" placeholder="Customer email" [(ngModel)]="emailFilter" (keyup.enter)="applyFilters()" />
  <select [(ngModel)]="statusFilter">
    <option value="">All statuses</option>
    @for (s of statusOptions; track s) { <option [value]="s">{{ s }}</option> }
  </select>
  <button type="button" class="btn-primary" (click)="applyFilters()">Filter</button>
</div>

@if (isLoading()) {
  <p>Loading…</p>
} @else {
  <table class="data-table card">
    <thead><tr><th>Order #</th><th>Placed</th><th>Status</th><th>Total</th><th>Update Status</th></tr></thead>
    <tbody>
      @for (o of orders(); track o.id) {
        <tr>
          <td>{{ o.orderNumber }}</td>
          <td>{{ o.placedAt | date:'short' }}</td>
          <td><span class="status-pill" [class]="o.status.toLowerCase()">{{ o.status }}</span></td>
          <td>{{ o.grandTotal | currency }}</td>
          <td>
            <select #statusSelect [ngModel]="o.status" (ngModelChange)="updateStatus(o, $event)">
              @for (s of statusOptions; track s) { <option [value]="s">{{ s }}</option> }
            </select>
          </td>
        </tr>
      }
      @if (orders().length === 0) { <tr><td colspan="5">No orders match these filters.</td></tr> }
    </tbody>
  </table>
  <app-pagination [currentPage]="page()" [totalPages]="totalPages()" (pageChange)="onPageChange($event)"></app-pagination>
}
